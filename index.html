<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Calcolatore Frazionamento Professionale by Lorenzo Loseto</title>
    <meta name="description" content="Calcola il margine, il ROI e gli scenari del tuo prossimo frazionamento immobiliare con il tool gratuito di Lorenzo Loseto. 30+ voci di ristrutturazione, comparabili di mercato, condivisione protetta con NDA." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Georgia', 'Times New Roman', serif; background: #0D2240; }
      #root { min-height: 100vh; }
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }
      .cap-safe-top { padding-top: env(safe-area-inset-top) !important; }
      .cap-safe-bottom { padding-bottom: calc(14px + env(safe-area-inset-bottom)) !important; }
    </style>
  </head>
  <body>
    <div id="ll-flowbar"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Barra "anteprima flusso" — visibile solo con ?flow=1 (da mappa-funnel → "Apri con flusso"). I lead non la vedono. -->
    <script>
      (function(){
        if (new URLSearchParams(location.search).get('flow') !== '1') return;
        var S = 'https://lorenzoloseto.com';
        var steps = [
          ['1·Bridge','/video-gratuito'],['1·Quiz','/quiz-frazionamento'],
          ['1·Calc','/calcolatore-frazionamento/'],['2·VSL A','/video-mfib'],
          ['2·VSL B','/video-mfib-b'],['3·Prenota','/prenota-call'],
          ['4·Grazie','/grazie-call'],['6·Post-call','/mfb-riepilogocallstrategica'],
          ['🗺 Mappa','/mappa-funnel']
        ];
        var cur = '/calcolatore-frazionamento';
        var bar = document.getElementById('ll-flowbar');
        bar.setAttribute('style','display:flex;align-items:center;gap:10px;background:#0B1220;border-bottom:1px solid #233148;padding:7px 10px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif');
        var h = '<span style="flex:0 0 auto;color:#C4841D;font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase">🔧 FLUSSO · solo tu</span>';
        h += '<nav style="flex:1 1 auto;display:flex;gap:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none">';
        steps.forEach(function(s){
          var isCur = (s[1].replace(/\/+$/,'') || '/') === cur;
          var href = S + s[1] + (s[1].indexOf('?') >= 0 ? '&' : '?') + 'flow=1';
          var st = isCur
            ? 'background:#C4841D;color:#0B1220;border:1px solid #C4841D'
            : 'background:#131c2e;color:#9fb0c6;border:1px solid #233148';
          h += '<a href="'+href+'" style="flex:0 0 auto;text-decoration:none;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600;'+st+'">'+s[0]+'</a>';
        });
        h += '</nav>';
        h += '<button id="ll-flow-x" title="Nascondi" style="flex:0 0 auto;cursor:pointer;background:none;border:none;color:#56657f;font-size:16px;line-height:1;padding:2px 4px">✕</button>';
        bar.innerHTML = h;
        document.getElementById('ll-flow-x').onclick = function(){ bar.style.display = 'none'; };
      })();
    </script>
  </body>
</html>
